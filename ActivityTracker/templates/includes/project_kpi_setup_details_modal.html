<!-- Activity Request Details Modal -->

                <div class="d-flex">
                    <button type="button" class="btn btn-sm btn-outline-custom me-2" id="resetPageBtn" onclick="printPage()">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-custom2" data-dismiss="modal">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>

            <div class="modal-body">
                <table class="table table-sm table-bordered">
                    <tbody>
                        <tr>
                            <th>Requester</th>
                            <td id="viewRequesterProjectKpiSetupDetails"></td>

                            <th>Creation Date</th>
                            <td id="viewCreationDateProjectCodeProjectKpiSetupDetails"></td>
                        </tr>
                        <tr>
                            <th>Project Code</th>
                            <td id="viewProjectCodeProjectKpiSetupDetails"></td>
                            <th>Approved As</th>
                            <td id="viewApproveAsProjectCodeProjectKpiSetupDetails"></td>
                        </tr>
                        <tr>
                            <th>Project Name</th>
                            <td id="viewProjectNameProjectCodeProjectKpiSetupDetails"></td>
                        </tr>
                    </tbody>
                </table>

                <div>
                    <h5>Project KPIs</h5>
                    <table class="table table-sm table-bordered" style="table-layout: fixed; width: 100%;">
                        <thead>
                            <tr>
                                <th class="text-end" style="width: 5%;">#</th>
                                <th style="width: 20%;">Key Process</th>
                                <th class="text-end" style="width: 10%;">Credit Points</th>
                                <th style="width: 15%;">Creation Date</th>
                            </tr>
                        </thead>
                        <tbody id="kpiDetails"></tbody>
                    </table>

                <!-- Workflow Visualization -->
                <div id="workflowMapContainer">

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-outline-custom2" data-dismiss="modal">Close</button>

</div>

<style>
    /* ---------- Table Spacing & Wrapping ---------- */
    .table-sm th, .table-sm td {
        padding: 4px 8px !important;
        font-size: 14px;
        vertical-align: middle;
        white-space: normal !important;   /* allow wrapping */
        word-wrap: break-word !important;
        word-break: break-word !important;
        overflow-wrap: anywhere;
    }

    /* ---------- Workflow Container ---------- */
    #workflowMapContainer {
        padding-top: 25px;
    }

    .workflow-divider {
        border: 0;
        height: 0.4px;
        background: #dfdfe0;
        margin-bottom: 10px;
    }

    .workflow-item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-bottom: 30px;
        position: relative;
    }

    /* Left and right text columns */
    .workflow-text {
        flex: 1;
        max-width: 300px;
        text-align: center;
        word-wrap: break-word;
        word-break: break-word;
    }

    .text-right {
        text-align: right;
        padding-right: 20px;
    }

    .text-left {
        text-align: left;
        padding-left: 20px;
    }

    /* Central column containing icons and arrows */
    .workflow-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 80px;
        position: relative;
    }

    /* Circular step icons */
    .workflow-step {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        color: white;
        font-weight: bold;
        text-align: center;
        z-index: 2;
        position: relative;
    }

    /* Status colors */
    .workflow-step.approved {
        background-color: #28a745; /* Green */
    }

    .workflow-step.submitted {
        background-color: #28a745; /* Green */
    }

    .workflow-step.pending {
        background-color: #74787d;
    }

    .workflow-step.rejected {
        background-color: #dc3545; /* Red */
    }

    /* Vertical arrows between steps */
    .workflow-arrow {
        width: 4px;
        background-color: #007bff;
        position: absolute;
        top: 70px;
        height: 30px;
        transform: translateY(5px);
    }

    /* Create arrow pointer at the bottom */
    .workflow-arrow:after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        margin-left: -6px;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 8px solid #007bff;
    }

    /* Fix for last item (no arrow) */
    .workflow-item:last-child .workflow-arrow {
        display: none;
    }

    /* Section Headers */
    .modal-body h5 {
        padding-left: 10px;
        margin-top: 1.8rem;
        margin-bottom: 0.8rem;
    }

    /* ---------- Table Styling ---------- */
    .table-sm.table-bordered {
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 0.4rem;
        overflow: hidden;
        box-shadow: 0 0 4px rgba(0,0,0,0.05);
        margin-bottom: 1.2rem;
        table-layout: fixed;
        width: 100%;
    }

    .table-sm th {
        background-color: #f8f9fa;
        font-weight: 600;
        color: #484a52;
        vertical-align: middle;
        width: 25%;
    }

    .table-sm td {
        background-color: #fff;
        color: #484a52;
        vertical-align: top;
    }

    /* Compact spacing */
    .table-sm th, .table-sm td {
        padding: 0.5rem 0.75rem;
        line-height: 1.4;
    }

    /* ---------- Print Formatting ---------- */
    @media print {
        table {
            table-layout: fixed !important;
            width: 100% !important;
        }

        th, td {
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
        }

        .modal-body {
            padding: 1rem !important;
            background: #fff !important;
        }

        .table-bordered th, .table-bordered td {
            border: 1px solid #444 !important;
        }

        /* Preserve workflow colors */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
    }
</style>

<script>
    function loadProjectKpiSetupRequestApprovalWorkflow(kpiRequestSetupId, workflowId) {
        $.get("/get-project-kpi-setup-approval-workflow", { kpi_request_setup_id: kpiRequestSetupId, workflow_ID: workflowId })
        .done(function(response) {

            $("#workflowProjectKpiApprovalMap").empty();

            response.workflow_steps.forEach((step, index) => {
                let className = step.status === "Approved" ? "approved" :
                                step.status === "Submitted" ? "submitted" :
                                step.status === "Rejected" ? "rejected" : "pending";

                let iconClass = step.status === "Approved" ? "fa-check-circle" :
                                step.status === "Submitted" ? "fa-check-circle" :
                                step.status === "Rejected" ? "fa-times-circle" : "fa-clock";

                let leftText = index % 2 === 0 ?
                    `<div class="workflow-text text-right">
                        <strong style="text-decoration: underline;">${step.name}</strong><br>
                        <strong>Role:</strong> <small>${step.role}</small><br>
                        <strong>Status:</strong> <small>${step.status}</small><br>
                        <strong>Approver:</strong> <small>${step.approver || 'N/A'}</small><br>
                        <strong>Date:</strong> <small>${step.date || 'N/A'}</small><br>
                        <strong>Comment:</strong> <small>${step.comment || ' '}</small>
                    </div>`
                : `<div class="workflow-text"></div>`;

                let rightText = index % 2 !== 0 ?
                    `<div class="workflow-text text-left">
                        <strong style="text-decoration: underline;">${step.name}</strong><br>
                        <strong>Role:</strong> <small>${step.role}</small><br>
                        <strong>Status:</Strong> <small>${step.status}</small><br>
                        <strong>Approver:</strong> <small>${step.approver || 'N/A'}</small><br>
                        <strong>Date:</strong> <small>${step.date || 'N/A'}</small><br>
                        <strong>Comment:</strong> <small>${step.comment || ' '}</small>
                    </div>`
                : `<div class="workflow-text"></div>`;

                let stepHTML = `
                    <div class="workflow-item">
                        ${leftText}
                        <div class="workflow-center">
                            <div class="workflow-step ${className}">
                                <i class="fa ${iconClass}"></i>
                            </div>
                            ${index < response.workflow_steps.length - 1 ? '<div class="workflow-arrow"></div>' : ''}
                        </div>
                        ${rightText}
                    </div>
                `;

                $("#workflowProjectKpiApprovalMap").append(stepHTML);
            });

            const $taskBody = $("#kpiDetails");
            $taskBody.empty();

            if (response.kpi_details && response.kpi_details.length > 0) {

                let totalCreditPoints = 0;

                response.kpi_details.forEach((kpi_detail, index) => {

                    const creditPoints = parseFloat(kpi_detail.credit_points) || 0;
                    totalCreditPoints += creditPoints;

                    const newRow = $(`
                        <tr>
                            <td class="text-end">${index + 1}</td>
                            <td>${kpi_detail.process_name}</td>
                            <td style="text-align: right;">${creditPoints.toLocaleString()}</td>
                            <td>${kpi_detail.creation_date}</td>
                        </tr>
                    `);

                    $taskBody.append(newRow);
                });

                const totalRow = $(`
                    <tr class="fw-bold table-secondary">
                        <td colspan="2" class="text-end">
                            <strong>Total Credit Points</strong>
                        </td>
                        <td style="text-align: right;">
                            <strong>${totalCreditPoints.toLocaleString()}</strong>
                        </td>
                        <td></td>
                    </tr>
                `);

                $taskBody.append(totalRow);

            } else {
                showFlashMessage("No KPI details found for this request.", "warning");
            }
        })
        .fail(function(error) {
            console.error("Error loading workflow:", error);
        });
    }

    function printPage() {
        const modal = document.querySelector('#viewRequestModal .modal-content');
        if (!modal) return;

        const printContents = modal.cloneNode(true);
        const buttons = printContents.querySelectorAll('button');
        buttons.forEach(btn => btn.remove());

        const printWindow = window.open('', '', 'height=900,width=1100');
        printWindow.document.write(`
            <html>
            <head>
                <title>Activity Request Details</title>

                <!-- Include your icon library here -->
                <!-- If using Font Awesome -->
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

                <!-- Or if using Bootstrap Icons -->
                <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"> -->

                <style>
                    body {
                        font-family: Arial, sans-serif;
                        padding: 20px;
                        color: #000;
                        -webkit-print-color-adjust: exact !important;
                        print-color-adjust: exact !important;
                        background-color: #fff;
                    }

                    h5 {
                        margin-top: 24px;
                        font-size: 18px;
                        border-bottom: 1px solid #ccc;
                        padding-bottom: 4px;
                    }

                    table {
                        border-collapse: collapse;
                        width: 100%;
                        margin-bottom: 15px;
                    }

                    th, td {
                        border: 1px solid #ccc;
                        padding: 6px 8px;
                        font-size: 13px;
                        vertical-align: top;
                    }

                    th {
                        background-color: #f8f9fa !important;
                        text-align: left;
                    }

                    /* ---------- Table Spacing & Wrapping ---------- */
                    .table-sm th, .table-sm td {
                        padding: 4px 8px !important;
                        font-size: 14px;
                        vertical-align: middle;
                        white-space: normal !important;
                        word-wrap: break-word !important;
                        word-break: break-word !important;
                        overflow-wrap: anywhere;
                    }

                    .wrap-text {
                        white-space: normal !important;
                        word-wrap: break-word !important;
                        word-break: break-word !important;
                        overflow-wrap: anywhere !important;
                    }

                    /* ===== WORKFLOW PRINT STYLES ===== */
                    #workflowMapContainer {
                        page-break-inside: avoid;
                        margin-top: 30px;
                    }

                    .workflow-item {
                        display: grid;
                        grid-template-columns: 1fr 100px 1fr;
                        align-items: center;
                        justify-content: center;
                        text-align: center;
                        margin-bottom: 40px;
                        position: relative;
                    }

                    .workflow-text {
                        font-size: 13px;
                        line-height: 1.4;
                        padding: 0 10px;
                        word-wrap: break-word;
                    }

                    .workflow-center {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        position: relative;
                    }

                    .workflow-step {
                        width: 55px;
                        height: 55px;
                        border-radius: 50%;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        font-size: 20px;
                        color: white !important;
                        font-weight: bold;
                        text-align: center;
                        z-index: 2;
                        position: relative;
                        box-shadow: 0 0 4px rgba(0,0,0,0.2);
                        -webkit-print-color-adjust: exact !important;
                        print-color-adjust: exact !important;
                    }

                    .workflow-step.approved { background-color: #28a745 !important; }
                    .workflow-step.submitted { background-color: #28a745 !important; }
                    .workflow-step.pending { background-color: #74787d !important; }
                    .workflow-step.rejected { background-color: #dc3545 !important; }

                    .workflow-arrow {
                        width: 4px;
                        background-color: #007bff !important;
                        position: absolute;
                        top: 65px;
                        height: 35px;
                    }

                    .workflow-arrow:after {
                        content: '';
                        position: absolute;
                        bottom: -8px;
                        left: 50%;
                        margin-left: -6px;
                        border-left: 6px solid transparent;
                        border-right: 6px solid transparent;
                        border-top: 8px solid #007bff !important;
                    }

                    .workflow-item:last-child .workflow-arrow { display: none; }

                    hr.workflow-divider {
                        border: 0;
                        height: 1px;
                        background: #ccc;
                    }

                    @media print {
                        * {
                            -webkit-print-color-adjust: exact !important;
                            print-color-adjust: exact !important;
                        }
                    }
                </style>
            </head>
            <body>
                ${printContents.innerHTML}
                <div style="margin-top:40px; text-align:center; font-size:12px; color:#666;">
                    Printed on: ${new Date().toLocaleString()}
                </div>
            </body>
            </html>
        `);

        printWindow.document.close();
        printWindow.onload = function() {
            printWindow.focus();
            printWindow.print();
            printWindow.close();
        };
    }

</script>

<style>
    .wrap-text {
        white-space: normal !important;
        word-wrap: break-word !important;
        overflow-wrap: anywhere !important;
    }

        margin-left: 6px;
    }
