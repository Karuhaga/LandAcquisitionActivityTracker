<!-- Approval Action Modal -->
<div class="modal fade" id="addUserTaggedProjectsModal" tabindex="-1" aria-labelledby="approvalActionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="approvalActionModalLabel">Tagg User to a Project</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

            <form id="userTaggedProjectAddForm" class="p-4 rounded shadow-sm bg-white">
                <div class="mb-3 row align-items-center">
                    <label for="user_user_project" class="col-md-4 col-form-label fw-semibold">Username <span class="text-danger">*</span></label>
                    <div class="col-md-8">
                        <select class="form-control w-100" id="user_user_project" required>
                            <option value="">-- Select --</option>
                            {% for username in usernames %}
                                <option value="{{ username.id }}">{{ username.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3 row align-items-center">
                    <label for="project_user_project" class="col-md-4 col-form-label fw-semibold">Project <span class="text-danger">*</span></label>
                    <div class="col-md-8">
                        <select class="form-control w-100" id="project_user_project" required>
                            <option value="">-- Select --</option>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.project_code }} - {{ project.project_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3 row align-items-center">
                    <label for="start_date_user_project" class="col-md-4 col-form-label fw-semibold">
                        Start Date <span class="text-danger">*</span>
                    </label>
                    <div class="col-md-8">
                        <input type="date" id="start_date_user_project" name="start_date_user_project" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3 row align-items-center">
                    <label for="end_date_user_project" class="col-md-4 col-form-label fw-semibold">
                        End Date <span class="text-danger">*</span>
                    </label>
                    <div class="col-md-8">
                        <input type="date" id="end_date_user_project" name="end_date_user_project" class="form-control" required>
                    </div>
                </div>
            </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-outline-custom2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-outline-custom" id="confirmUserTaggedProjectAdditionAction">Submit</button>
            </div>
        </div>
    </div>
</div>

<script>
    //Load current date in start_date_user_project and end_date_user_project form fields
    $('#addUserTaggedProjectsModal').off('shown.bs.modal').on('shown.bs.modal', function () {
        const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
        $('#start_date_user_project').val(today);
        $('#end_date_user_project').val(today);
    });
</script>
