<script>
    function loadCompletedWipActivityRequestLogDetails(activityRequestId) {
        $.get("/get-completed-wip-activity-approval-request-log-details", { activity_Request_ID: activityRequestId, workflow_ID: workFlowId })
        .done(function(response) {
            // ======== 1. Populate Activity Overview ========
            const overview = response.saved_activity_request_details_2 || {};

            $("#viewRequesterCompletedWipLogDetails").text(overview.requester);
            $("#viewSubjectCompletedLogDetails").text(overview.subject);
            $("#viewObjectivesCompletedLogDetails").text(overview.objectives);
            $("#viewScopeCompletedLogDetails").text(overview.scope);
            $("#viewStakeholdersCompletedLogDetails").text(overview.stakeholders);
            $("#viewDeliverablesCompletedLogDetails").text(overview.deliverables);
            $("#viewAssumptionsCompletedLogDetails").text(overview.assumptions);

            // ======== 2. Populate Team Composition ========
            const $teamBody = $("#teamCompositionInputs4");
            $teamBody.empty();

            if (response.team && response.team.length > 0) {
                response.team.forEach((member, index) => {
                    const newRow = $(`
                        <tr>
                            <td class="text-end">${index + 1}</td>
                            <td>${member.member_name}</td>
                            <td>${member.member_role}</td>
                        </tr>
                    `);

                    $teamBody.append(newRow);
                });
            } else {
                showFlashMessage("No team members found for this request.", "warning");
            }

            // ======== 3. Populate Activity Logs ========
            const tbody = document.getElementById("activityLogs");
            tbody.innerHTML = "";

            if (!response.logs || response.logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center">No logs found</td></tr>`;
                return;
            }

            response.logs.forEach((log, logIndex) => {

                const rowNumber = logIndex + 1;   //Row number starts at 1

                log.breakdowns.forEach((b, index) => {

                    let row = "<tr>";

                    // Only render merged cells once per log
                    if (index === 0) {

                        row += `<td rowspan="${log.row_count}">${rowNumber}</td>`;   //Row Number

                        row += `<td rowspan="${log.row_count}">${log.team_member || ""}</td>`;
                        row += `<td rowspan="${log.row_count}">${log.creation_date || ""}</td>`;
                        row += `<td rowspan="${log.row_count}">${log.task || ""}</td>`;
                    }

                    row += `<td>${b.start_date || ""}</td>`;
                    row += `<td>${b.end_date || ""}</td>`;
                    row += `<td>${b.detail || ""}</td>`;

                    if (index === 0) {
                        let fileLinks = "";

                        if (log.files) {
                            const filesArray = log.files.split(",");

                            fileLinks = filesArray.map((file, i) => `
                                ${i + 1}.
                                <a href="/download/activity-log/${file.trim()}"
                                   class="text-primary"
                                   target="_blank">
                                   ${file.trim()}
                                </a>
                            `).join("<br>");
                        }

                        row += `<td rowspan="${log.row_count}">${fileLinks}</td>`;
                    }

                    row += "</tr>";

                    tbody.innerHTML += row;
                });

            });

        })
        .fail(function(error) {
            console.error("Error loading workflow:", error);
        });
    }

    function daysBetween(start, end) {
        const s = new Date(start).setHours(0, 0, 0, 0);
        const e = new Date(end).setHours(0, 0, 0, 0);
        return ((e - s) / (1000 * 60 * 60 * 24)) + 1; // inclusive
    }

    function calculateTotalDays() {
        let earliest = null;
        let latest = null;

        // Use your table ID (#activityBreakdownInputs3)
        $("#activityBreakdownInputs3 tr").each(function() {
            const startText = $(this).find(".start-date").text().trim();
            const endText = $(this).find(".end-date").text().trim();

            if (startText && endText) {
                const start = new Date(startText);
                const end = new Date(endText);

                if (!earliest || start < earliest) earliest = start;
                if (!latest || end > latest) latest = end;
            }
        });

        // Remove any existing total row to avoid duplicates
        $("#activityBreakdownInputs3 tr.total-row").remove();

        // Append the new total row
        if (earliest && latest) {
            const diff = daysBetween(earliest, latest);
            const totalRow = $(`
                <tr class="fw-bold">
                    <td></td>
                    <td colspan="4" class="text-end">Total No. of Days (All Tasks):</td>
                    <td class="text-center total-days">${diff >= 0 ? diff : 0}</td>
                </tr>
            `);
            $("#activityBreakdownInputs3").append(totalRow);
        } else {
            const totalRow = $(`
                <tr class="fw-bold">
                    <td></td>
                    <td colspan="4" class="text-end">Total No. of Days (All Tasks):</td>
                    <td class="text-center total-days">0</td>
                </tr>
            `);
            $("#activityBreakdownInputs3").append(totalRow);
        }
    }

    // Handler for download button
    $(document).off("click", ".download-btn").on("click", ".download-btn", function() {
        const fileName = $(this).data("filename");

        if (!fileName) {
            showFlashMessage("File not available for download.", "warning");
            return;
        }

        const fileUrl = `/download/${encodeURIComponent(fileName)}`;
        const ext = fileName.split('.').pop().toLowerCase();

        if (["pdf", "png", "jpg", "jpeg"].includes(ext)) {
            // Open inline for viewable files
            window.open(fileUrl, "_blank");
        } else {
            // Force download for other types
            const a = document.createElement("a");
            a.href = fileUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    });

function printPage() {

    const modalContent = document.querySelector('#viewCompletedWipApprovalRequestLogsModal .modal-content');
    if (!modalContent) return;

    const printContents = modalContent.cloneNode(true);

    // Remove buttons (Print & Close)
    printContents.querySelectorAll('button').forEach(btn => btn.remove());

    const printWindow = window.open('', '', 'height=900,width=1200');

    printWindow.document.write(`
        <html>
        <head>
            <title>Activity Request Details</title>

            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 20px;
                    color: #000;
                    background: #fff;
                }

                h5 {
                    margin-top: 24px;
                    font-size: 16px;
                    border-bottom: 1px solid #999;
                    padding-bottom: 4px;
                }

                table {
                    border-collapse: collapse;
                    width: 100%;
                    margin-bottom: 15px;
                    table-layout: fixed;
                }

                th, td {
                    border: 1px solid #444;
                    padding: 6px 8px;
                    font-size: 12px;
                    vertical-align: top;
                    word-break: break-word;
                    overflow-wrap: anywhere;
                }

                th {
                    background-color: #f2f2f2;
                    text-align: left;
                }

                /* Prevent links from showing blue/underline in print */
                a {
                    color: #000 !important;
                    text-decoration: none !important;
                }

                /* Hide modal footer */
                .modal-footer {
                    display: none !important;
                }

                /* Remove box shadows */
                .table-sm.table-bordered {
                    box-shadow: none !important;
                }

                /* Force proper color printing */
                * {
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
            </style>
        </head>
        <body>

            ${printContents.innerHTML}

            <div style="margin-top:40px; text-align:center; font-size:11px; color:#666;">
                Printed on: ${new Date().toLocaleString()}
            </div>

        </body>
        </html>
    `);

    printWindow.document.close();

    printWindow.onload = function () {
        printWindow.focus();
        printWindow.print();
        printWindow.close();
    };
}

</script>
