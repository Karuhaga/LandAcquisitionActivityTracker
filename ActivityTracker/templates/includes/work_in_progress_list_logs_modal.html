<!-- Activity Request Details Modal -->
<div class="modal fade" id="workInProgressListLogsModal" tabindex="-1" aria-labelledby="viewRequestModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header d-flex justify-content-between align-items-center">
                <h5 class="modal-title mb-0" id="viewRequestModalLabel">Activity Logs List</h5>

                <div class="d-flex">
                    <button type="button" class="btn btn-sm btn-outline-custom me-2" id="resetPageBtn" onclick="printPage()">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-custom2" data-dismiss="modal">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>

            <div class="modal-body">
                <input type="hidden" id="activityTaskIdWIPLog">

                <select id="key_process_dropdown_wip_list_logs_modal" class="d-none">
                    {{ key_process_options | safe }}
                </select>

                <table class="table table-sm table-bordered">
                    <tbody>
                        <tr>
                            <th>Requester</th>
                            <td id="viewRequesterWipLog"></td>

                            <th style="width: 20%">Subject</th>
                            <td id="viewSubjectWIPLog"></td>
                        </tr>
                        <tr>
                            <th>Project Code</th>
                            <td id="viewProjectCodeWipLog"></td>

                            <th>Project Name</th>
                            <td id="viewProjectNameWipLog"></td>
                        </tr>
                    </tbody>
                </table>

                <!-- wipListLogsTable-->
                <div id="">
                    <table id="wipListLogsTable" class="table table-striped table-bordered table-hover paginated">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Key Process</th>
                                <th>Task</th>
                                <th>Created By</th>
                                <th>Creation Date</th>
                                <th>View Log</th>
                                <th>Edit Log</th>
                                <th>Delete Log</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.wipViewEditLogModalMode = window.wipViewEditLogModalMode || 1; // 1 = View Mode, 2 = Edit Mode

    window.wipLogsTable = window.wipLogsTable || null;

    function initWipLogsTable() {
        if ($.fn.DataTable.isDataTable('#wipListLogsTable')) {
            return;
        }

        wipLogsTable = $('#wipListLogsTable').DataTable({
            paging: true,
            searching: true,
            ordering: true,
            pageLength: 10,
            autoWidth: false,
            columns: [
                { data: null }, // Row number
                { data: 'key_process_name' },
                { data: 'task' },
                { data: 'user_name' },
                { data: 'creation_date' },
                { data: null },
                { data: null },
                { data: null }
            ],
            columnDefs: [
                {
                    targets: 0,
                    render: (data, type, row, meta) => meta.row + 1
                },
                {
                    targets: 4,
                    render: data => new Date(data).toLocaleString()
                },
                {
                    targets: 5,
                    orderable: false,
                    render: (d, t, row) => `
                        <button class="btn btn-sm btn-outline-secondary view-log" data-log-id="${row.id}">
                            <i class="fa fa-eye"></i>
                        </button>`
                },
                {
                    targets: 6,
                    orderable: false,
                    render: (d, t, row) => `
                        <button class="btn btn-sm btn-outline-primary edit-log" data-log-id="${row.id}">
                            <i class="fa fa-edit"></i>
                        </button>`
                },
                {
                    targets: 7,
                    orderable: false,
                    render: (d, t, row) => `
                        <button class="btn btn-sm btn-outline-danger delete-log" data-log-id="${row.id}">
                            <i class="fa fa-trash"></i>
                        </button>`
                }
            ]
        });
    }

    $(document).off("click", ".view-log, .edit-log").on("click", ".view-log, .edit-log", function () {

        const isView = $(this).hasClass("view-log");
        const logId = $(this).data("log-id");

        window.wipViewEditLogModalMode = isView ? 1 : 2;

        loadWipLog(logId, window.wipViewEditLogModalMode);
    });

    $(document).off("click", ".delete-log").on("click", ".delete-log", function () {

        const logId = $(this).data("log-id");

        let modalTitle = "";
        let modalMessage = "";

        modalTitle = "Delete Confirmation";
        modalMessage = "Are you sure you want to delete this activity log?";

        // Remove old handlers safely
        $("#confirmAction").off("click.confirm");

        $("#confirmAction").off("click").on("click", function() {
            // Close confirmation FIRST
            $("#confirmationModal").modal("hide");

            deleteActivityLog(logId);
        });

        // Set modal text
        $("#confirmationModalLabel").text(modalTitle);
        $("#confirmationMessage").text(modalMessage);

        // Show modal
        $("#confirmationModal").modal({
            backdrop: "static",
            keyboard: false
        });

    });

    function loadWipLog(logId, mode) {
        $("#trnActivityLogOverviewIdViewEditLogModal").val(logId);
        $("#viewEditRequesterWIP").text($("#viewRequesterWipLog").text());
        $("#viewEditSubjectWIP").text($("#viewSubjectWIPLog").text());
        $("#viewEditProjectCodeWIP").text($("#viewProjectCodeWipLog").text());
        $("#viewEditProjectNameWIP").text($("#viewProjectNameWipLog").text());

        // Populate Key Process Options
        const keyProcessOptions = $("#key_process_dropdown_wip_list_logs_modal").html();
        $("#key_process_drop_down_view_edit_wip").html(keyProcessOptions);

        // Populate Tasks Options
        const $taskDropdown = $("#activity_task_wip_view_edit");

        $.ajax({
            url: `/get-view-edit-activity-log-key-process-task/${logId}`,
            type: "GET",
            success: function (response) {

                const savedKeyProcessId = response.key_process_id;
                const savedTaskId = response.task_id;
                $taskDropdown.empty().prop("disabled", true);

                //Preselect Key Process
                $("#key_process_drop_down_view_edit_wip").val(savedKeyProcessId);

                //Load tasks for selected key process
                $.ajax({
                    url: `/get-tasks-by-key-process/${savedKeyProcessId}/${$("#activityTaskIdWIPLog").val()}`,
                    type: "GET",
                    success: function (tasks) {

                        if (!tasks || tasks.length === 0) {
                            $taskDropdown.append('<option value="">No tasks available</option>');
                            return;
                        }

                        tasks.forEach(task => {
                            $taskDropdown.append(
                                `<option value="${task.id}">${task.task}</option>`
                            );
                        });

                        // Preselect Task
                        $taskDropdown.val(savedTaskId).prop("disabled", false);
                    },
                    error: function () {
                        alert("Failed to load tasks.");
                    }
                });
            },
            error: function () {
                alert("Failed to load tasks for the selected key process.");
            }
        });

        // Load Activity Breakdowns
        $.ajax({
            url: "/get-activity-breakdown-details",
            type: "GET",
            data: { log_id: logId },
            success: function (response) {

                const breakdowns = response.activity_breakdown_details;

                if (!breakdowns || breakdowns.length === 0) {
                    showFlashMessage("No Activity Breakdown found for this request.", "warning");
                    return;
                }

                const $tbody = $("#activityTaskInputsViewEditWip");
                $tbody.empty();

                breakdowns.forEach((item, index) => {

                    const startDate = item.start_date
                        ? new Date(item.start_date).toISOString().split("T")[0]
                        : "";

                    const endDate = item.end_date
                        ? new Date(item.end_date).toISOString().split("T")[0]
                        : "";

                    const newRow = $(`
                        <tr>
                            <td class="text-end">${index + 1}</td>
                            <td>
                                <input type="text"
                                       class="form-control start-date"
                                       name="start_date[]"
                                       value="${startDate}"
                                       autocomplete="off">
                            </td>
                            <td>
                                <input type="text"
                                       class="form-control end-date"
                                       name="end_date[]"
                                       value="${endDate}"
                                       autocomplete="off">
                            </td>
                            <td>
                                <input type="text"
                                   class="form-control available-credit-points-wip-log"
                                   name="available_credit_points_wip_log[]"
                                   value="${item.available_credit_points}"
                                   data-original="${item.available_credit_points}"
                                   style="text-align: right;"
                                   inputmode="numeric"
                                   pattern="[0-9,]+"
                                   required disabled>
                            </td>
                            <td>
                                <input type="text"
                                   class="form-control set-credit-points-wip-log"
                                   name="set_credit_points_wip_log"
                                   value="${item.credit_points}"
                                   style="text-align: right;"
                                   inputmode="numeric"
                                   pattern="[0-9,]+"
                                   required>
                            </td>
                            <td class="days-diff text-center">0</td>
                            <td>
                                <textarea class="form-control"
                                          name="activityBreakdownDetailsViewEdit[]"
                                          rows="2"
                                          maxlength="150">${item.detail || ""}</textarea>
                            </td>
                            <td class="text-center">
                                <button type="button"
                                        class="btn btn-sm btn-danger"
                                        onclick="removeRow(this)">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `);

                    window.originalCreditPointBalance = Number(item.available_credit_points || 0);

                    $tbody.append(newRow);
                });

                // Reinitialize date pickers
                initDatePickers($tbody);

                // Recalculate days per row
                $tbody.find("tr").each(function () {
                    calculateDays($(this));
                });

                // Recalculate total days
                calculateTotalDays();

                recalculateCreditPointBalancesViewEditLog();

                // Call secondary modal
                showWorkInProgressViewEditLogModal();
            },
            error: function (xhr) {
                showFlashMessage(
                    xhr.responseJSON?.error || "Failed to load activity breakdown.",
                    "danger"
                );
            }
        });

        // Load attachments
        $.ajax({
            url: "/get-activity-log-attachments",
            type: "GET",
            data: { log_id: logId },
            success: function(response) {
                const attachments = response.attachments || [];
                const $tbody = $("#attachmentsTableViewEditWip");
                $tbody.empty(); // clear any existing rows

                if (attachments.length > 0) {
                    attachments.forEach((att, index) => {
                        const fileUrl = `/download/activity-log/${att.file}`; // adjust if uploads folder is elsewhere
                        const newRow = $(`
                            <tr data-attachment-id="${att.id}">
                                <td class="text-end">${index + 1}</td>
                                <td>
                                    <div class="filename-cell" title="${att.file}">
                                        ${att.file}
                                    </div>
                                </td>
                                <td>
                                    <textarea class="form-control" name="attachment_description[]" rows="2"
                                        placeholder="Enter description (optional)" maxlength="500" disabled>${att.description || ''}</textarea>
                                </td>
                                <td class="text-center">
                                    <a href="${fileUrl}" class="btn btn-sm btn-secondary"
                                       ${att.file.toLowerCase().match(/\.(pdf|png|jpg|jpeg)$/) ? 'target="_blank"' : 'download'}>
                                        <i class="fa fa-download"></i>
                                    </a>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-danger" onclick="removeAttachmentRowViewEditWip(this)">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `);
                        $tbody.append(newRow);
                    });
                } else {
                    // If no attachments exist, show an empty file input row
                    const emptyRow = $(`
                        <tr>
                            <td class="text-end">1</td>
                            <td><input type="file" class="form-control" name="attachments[]" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"></td>
                            <td><textarea class="form-control" name="attachment_description[]" rows="2" placeholder="Enter description (optional)" maxlength="500"></textarea></td>
                            <td class="text-center"><button type="button" class="btn btn-sm btn-secondary"><i class="fa fa-download"></i></button></td>
                            <td class="text-center"><button type="button" class="btn btn-sm btn-danger" onclick="removeAttachmentRowViewEditWip(this)"><i class="fa fa-trash"></i></button></td>
                        </tr>
                    `);
                    $tbody.append(emptyRow);
                }

                // Always append the "Add File" row at the end
                $tbody.append(`
                    <tr>
                        <td colspan="5" class="text-end">
                            <button type="button" class="btn-outline-custom float-end" onclick="addAttachmentRowViewEditWip()">
                                <i class="fa fa-plus"></i> Add File
                            </button>
                        </td>
                    </tr>
                `);
            },
            error: function(xhr) {
                showFlashMessage(xhr.responseJSON?.error || "Failed to load attachments.", "danger");
            }
        });
    }

    function showWorkInProgressViewEditLogModal() {
    
        /* ===============================
           Key Process & Task
           =============================== */
        $("#key_process_drop_down_view_edit_wip").prop("disabled", false);
        $("#activity_task_wip_view_edit").prop("disabled", false);

        /* ===============================
           Activity Breakdown section
           =============================== */
        $("#tableActivityTaskInputsViewEditWip")
            .find("input, textarea, button")
            .prop("disabled", false);

        /* ===============================
           Attachments section
           =============================== */
        $("#attachmentsTableViewEditWip")
            .find("input, textarea, button")
            .prop("disabled", false);

        /* Add File button (important!) */
        $(".add-attachment-btn").prop("disabled", false);

        /* ===============================
           Footer buttons
           =============================== */
        // Disable Save in View mode
        $("#workInProgressViewEditLogModal")
            .find("button:contains('Save')")
            .prop("disabled", false);    

        if (window.wipViewEditLogModalMode === 1){
            /* ===============================
               Key Process & Task
               =============================== */
            $("#key_process_drop_down_view_edit_wip").prop("disabled", true);
            $("#activity_task_wip_view_edit").prop("disabled", true);

            /* ===============================
               Activity Breakdown section
               =============================== */
            $("#tableActivityTaskInputsViewEditWip")
                .find("input, textarea, button")
                .prop("disabled", true);

            /* ===============================
               Attachments section
               =============================== */
            $("#attachmentsTableViewEditWip")
                .find("input, textarea, button")
                .prop("disabled", true);

            /* Add File button (important!) */
            $(".add-attachment-btn").prop("disabled", true);

            /* ===============================
               Footer buttons
               =============================== */
            // Disable Save in View mode
            $("#workInProgressViewEditLogModal")
                .find("button:contains('Save')")
                .prop("disabled", true);
        }

        $("#workInProgressViewEditLogModal").modal({
            backdrop: "static",
            keyboard: false
        });

        setTimeout(() => {
            $("#workInProgressViewEditLogModal").css("z-index", 1065);
            $(".modal-backdrop").last().css("z-index", 1064);
        }, 10);
    }

    $(document).off('hidden.bs.modal').on('hidden.bs.modal', function () {
        if ($('.modal.show').length) {
            $('body').addClass('modal-open');
        }
    });

    function deleteActivityLog(activityLogId) {

        if (!activityLogId) {
            showFlashMessage("Invalid activity log ID.", "danger");
            return;
        }

        $.ajax({
            url: "/delete-saved-activity-wip-log-details",
            type: "POST",
            data: {
                activity_log_id: activityLogId
            },
            success: function(response) {
                showFlashMessage(response.message || "Activity log deleted successfully.", "success");

                $("#flashMessageModal").off("hidden.bs.modal").on("hidden.bs.modal", function() {
                    location.reload();
                });
            },
            error: function() {
                showFlashMessage("Failed to delete saved activity log details. Please try again.", "danger");
            }
        });
    }

    function deleteActivityLogForEditing(activityLogId) {

        if (!activityLogId) {
            showFlashMessage("Invalid activity log ID.", "danger");
            return;
        }

        $.ajax({
            url: "/delete-saved-activity-wip-log-details-for-editing",
            type: "POST",
            data: {
                activity_log_id: activityLogId
            },
            success: function(response) {
                showFlashMessage(response.message || "Activity log deleted successfully.", "success");

                $("#flashMessageModal").off("hidden.bs.modal").on("hidden.bs.modal", function() {
                    location.reload();
                });
            },
            error: function() {
                showFlashMessage("Failed to delete saved activity log details. Please try again.", "danger");
            }
        });
    }

</script>

<style>
    .wrap-text {
        white-space: normal !important;
        word-wrap: break-word !important;
        overflow-wrap: anywhere !important;
    }
    .modal-header .btn {
        margin-left: 6px;
    }

    #saveConfirmationModal {
        z-index: 1060;
    }

    #workInProgressAddLogModal {
        z-index: 1060;
    }

    .modal-backdrop.show:nth-of-type(2) {
        z-index: 1055;
    }

</style>
